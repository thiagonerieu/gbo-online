<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GameBook Organiser - Entrada X</title>
        <link rel="stylesheet" href="../../public/assets/styles/style.css">
        <link rel="stylesheet" href="../../public/assets/styles/app-my-projects.css">
    </head>
<body class="page-my-projects">

    <header class="page-header">
        <img src="../../public/assets/imgs/logo-gbo.svg" class="page-header-logo" alt="logo GameBook Organiser">
        <span class="project-title">Le Petit Chaperon Rouge</span>
        <h1 class="page-title">Entrada X</h1>
    </header>
    
    <main class="page-main">
        
        <div class="model-entry">
            <form >
                <div class="ref-title-entry">
                    <label>Ref. #</label>
                    <input id="ref-entry" class="form-input" type="text" name="ref">
                    <label>Titre court</label>
                    <input id="title-entry" class="form-input" type="text" name="title-entry">
                </div>
                <div class="note-entry">
                    <label>Note de l'auteur</label>
                    <input id="note-entry" class="form-input" type="text" name="note-entry">
                </div>
                <div class="text-entry">
                    <label>Texte</label>
                    <textarea id="text-entry" class="form-input"name="text-entry"></textarea>
                </div>
                <div class="choice-entry">
                    <p>Lex Choix</p>
                    <div class="choice-entry-ligne">
                        <input class="form-input form-input-choice-entry" type="text" name="choice-entry">
                        <button class="btn btn-secondary profile-btn-edit" data-field="firstname" value="A">A</button>
                    </div>
                    <div class="choice-entry-ligne">
                        <input class="form-input form-input-choice-entry" type="text" name="choice-entry">
                        <button class="btn btn-secondary profile-btn-edit" data-field="firstname" value="B">B</button>
                    </div>
                </div>
            </form> 
        </div>

    </main>
    
    <footer class="page-footer">        
        <nav class="app-bottomnav">
            <a href="#" class="bottomnav-item">
                <img src="../../public/assets/icons/icon-settings.svg" class="bottomnav-icon" alt="Paramètres">
            </a>
            <a href="#" class="bottomnav-item">
                <img src="../../public/assets/icons/icon-langue.svg" class="bottomnav-icon" alt="Langue">
            </a>
            <a href="view-app-my-projects.html" class="bottomnav-item">
                <img src="../../public/assets/icons/icon-projects.svg" class="bottomnav-icon" alt="Projets">
            </a>
            <a href="/" class="bottomnav-item bottomnav-item--active">
                <img src="../../public/assets/icons/icon-profile.svg" class="bottomnav-icon" alt="Profil">
            </a>
            <a href="#" class="bottomnav-item">
                <img src="../../public/assets/icons/icon-disconnect.svg" class="bottomnav-icon" alt="Déconnexion">
            </a>
        </nav>
    </footer>

    <script src="../../public/assets/scripts/app-my-projects.js"></script>
</body>
</html>
